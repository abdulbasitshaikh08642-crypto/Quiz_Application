{% extends 'base.html' %}

{% block title %}Quiz Master | Edit Question{% endblock %}

{% block content %}
  <section class="section-block">
    <h1>Edit Question</h1>

    {% if error %}
      <div class="message error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('edit_question', question_id=question.id) }}" class="question-form">
      <div class="grid-two">
        <label>
          Category
          <select name="category_id" required>
            {% for category in categories %}
              <option value="{{ category.id }}" {% if category.id == question.category_id %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Correct answer
          <select name="correct_option" required>
            {% for option in ['A','B','C','D'] %}
              <option value="{{ option }}" {% if option == question.correct_option %}selected{% endif %}>{{ option }}</option>
            {% endfor %}
          </select>
        </label>
      </div>

      <label>
        Question
        <textarea name="question_text" rows="3" required>{{ question.question_text }}</textarea>
      </label>

      <div class="grid-two">
        <label>
          Option A
          <input type="text" name="option_a" value="{{ question.option_a }}" required />
        </label>
        <label>
          Option B
          <input type="text" name="option_b" value="{{ question.option_b }}" required />
        </label>
        <label>
          Option C
          <input type="text" name="option_c" value="{{ question.option_c }}" required />
        </label>
        <label>
          Option D
          <input type="text" name="option_d" value="{{ question.option_d }}" required />
        </label>
      </div>

      <div class="result-actions">
        <button class="primary-btn" type="submit">Save changes</button>
        <a class="secondary-btn" href="{{ url_for('questions_page') }}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
